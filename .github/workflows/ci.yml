name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting review
        run: gofmt -d .
      - run: go vet ./...
      - run: go test -race ./...

      - name: Repeat race and crash recovery checks
        run: go test -race -count=10 -run 'TestCrashRecovery|TestSecurity' .
      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/comitia ./cmd/comitia
      - name: Multi-process stress
        run: python3 scripts/stress_agents.py --binary "$PWD/dist/comitia" --workers 12 --messages 100 > dist/stress.json
      - uses: actions/upload-artifact@v4
        with:
          name: comitia-linux-amd64
          path: dist/comitia
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stress-results
          path: dist/stress.json
          if-no-files-found: error
          retention-days: 7
