name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces the run in progress; the runner
# is shared, so stale runs would otherwise hold the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on the shared self-hosted runner, so pull requests from forks
# must not start them.
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record source revision
        # Same Revision/Dirty stamping as scripts/comitia_install.py build_flags,
        # taken before later steps can leave files in the checkout.
        run: |
          dirty=false
          test -z "$(git status --porcelain --untracked-files=all)" || dirty=true
          echo "COMITIA_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COMITIA_DIRTY=$dirty" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting check
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Inspector state and landing page tests
        run: node --test pkg/httpapi/ui-tests/*.test.mjs site/*.test.mjs tools/world-viewer/*.test.mjs
      - run: go vet ./...
      - name: Documentation structure, onboarding, evaluation and installer tests
        run: python3 -m unittest scripts/test_*.py
      - run: go test -race -timeout 20m ./...

      - name: Repeat race and crash recovery checks
        # The pattern selects at least 30 tests in these packages; fail rather
        # than repeat fewer if tests move or are renamed.
        run: |
          pattern='TestCrashRecovery|TestSecurity|TestSQLite'
          packages='./pkg/comitia ./internal/service ./internal/sqlstore'
          count=$(go test -list "$pattern" $packages | grep -c '^Test' || true)
          if [ "$count" -lt 30 ]; then echo "only $count tests match $pattern in $packages; expected at least 30"; exit 1; fi
          go test -race -timeout 20m -count=10 -run "$pattern" $packages
      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-X github.com/krimvp/comitia/pkg/comitia.Revision=$COMITIA_REVISION -X github.com/krimvp/comitia/pkg/comitia.Dirty=$COMITIA_DIRTY" \
            -o dist/comitia ./cmd/comitia
          (cd dist && sha256sum comitia > comitia.sha256)
      - name: Multi-process stress (3 runs)
        run: for run in 1 2 3; do python3 scripts/stress_agents.py --binary "$PWD/dist/comitia" --workers 12 --messages 100 >> dist/stress.json || exit 1; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comitia-linux-amd64
          path: |
            dist/comitia
            dist/comitia.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-results
          path: dist/stress.json
          if-no-files-found: error
          retention-days: 7

  inspector-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.24.13
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pkg/httpapi/ui-tests/browser/package-lock.json
      - name: Install browser test dependencies
        run: |
          npm ci --prefix pkg/httpapi/ui-tests/browser
          pkg/httpapi/ui-tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build inspector server
        run: go build -o "$RUNNER_TEMP/comitia-inspector" ./cmd/comitia
      - name: Inspector browser regressions
        env:
          COMITIA_BROWSER_REQUIRED: '1'
        run: COMITIA_BINARY="$RUNNER_TEMP/comitia-inspector" node --test pkg/httpapi/ui-tests/browser/*.test.mjs

  # The landing page's browser tests, as pages.yml runs them before
  # publishing, so a broken page fails the pull request instead of the deploy.
  site-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/browser/package-lock.json
      - name: Install browser test dependencies
        run: |
          npm ci --prefix site/browser
          site/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Site browser regressions
        run: node --test site/browser/*.test.mjs
