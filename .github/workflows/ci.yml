name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting check
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspector state and landing page tests
        run: node --test httpapi/ui-tests/*.test.mjs site/*.test.mjs
      - run: go vet ./...
      - name: Evaluation harness and installer tests
        run: python3 -m unittest scripts/test_comitia_client.py scripts/test_evaluate_agents.py scripts/test_evaluation_jev_runner.py scripts/test_install_linux_service.py scripts/test_install_credentials.py scripts/test_docs_onboarding.py scripts/test_world_viewer.py
      - run: go test -race ./...

      - name: Repeat race and crash recovery checks
        run: go test -race -count=10 -run 'TestCrashRecovery|TestSecurity|TestSQLite' .
      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/comitia ./cmd/comitia
      - name: Multi-process stress (3 runs)
        run: for run in 1 2 3; do python3 scripts/stress_agents.py --binary "$PWD/dist/comitia" --workers 12 --messages 100 >> dist/stress.json || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: comitia-linux-amd64
          path: dist/comitia
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stress-results
          path: dist/stress.json
          if-no-files-found: error
          retention-days: 7

  inspector-browser:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.24.13
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: httpapi/ui-tests/browser/package-lock.json
      - name: Install browser test dependencies
        run: |
          npm ci --prefix httpapi/ui-tests/browser
          httpapi/ui-tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build inspector server
        run: go build -o "$RUNNER_TEMP/comitia-inspector" ./cmd/comitia
      - name: Inspector browser regressions
        env:
          COMITIA_BROWSER_REQUIRED: '1'
        run: COMITIA_BINARY="$RUNNER_TEMP/comitia-inspector" node --test httpapi/ui-tests/browser/*.test.mjs
