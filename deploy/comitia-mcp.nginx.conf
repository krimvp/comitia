# Comitia MCP gateway — public HTTPS edge.
#
# Exposes exactly one route: POST /mcp, terminated with real TLS and forwarded
# to the loopback streamable-HTTP adapter. Comitia itself stays bound to
# 127.0.0.1 and is never publicly reachable; /ui/, /v1/*, /admin, /debug and
# /metrics are unreachable from outside, and the browser inspector stays an
# SSH-forwarding concern.
#
# Two credential transports, same secret and same revocation:
#
#   POST /mcp                  credential in the Authorization header
#   POST /mcp/<credential>     credential in the path
#
# The header is preferred, because a secret in a URL leaks through shell
# history, proxy logs and screenshots. The path form exists because ChatGPT's
# connector UI offers no field for a custom header.
#
# WHY THIS ALSO LISTENS ON 443
#
# ChatGPT's connector broker only dispatches to the standard HTTPS port. A
# server on a non-standard port receives no traffic at all — the connection is
# never dialled, so it is not a TLS, DNS or firewall fault and no amount of
# server-side testing reveals it. :8443 therefore cannot serve ChatGPT, however
# healthy it looks under curl.
#
# WHY THE HOSTNAME AND NOT THE IP
#
# memoramum already terminates TLS on 443 for the bare IP address. The two are
# kept apart entirely by server_name and share nothing. This file sorts before
# memoramum in sites-enabled, so it is also the fallback server for an
# unrecognised Host header — which stays a 404 rather than being handed to
# another service.

# Per-IP request limit. `limit_req_zone` is valid here because this file is
# included from within nginx's http context.
limit_req_zone $binary_remote_addr zone=comitia_mcp:10m rate=5r/s;

# Credentials must never reach the access log. The default combined format
# records the request line, which would include a URL-embedded credential;
# this keeps host, port, method and status only.
log_format comitia_mcp_safe '$host $server_port "$request_method" $status '
                            '$body_bytes_sent $request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vmi3260467.contaboserver.net;

    ssl_certificate     /etc/letsencrypt/live/vmi3260467.contaboserver.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmi3260467.contaboserver.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/comitia-mcp.access.log comitia_mcp_safe;
    error_log  /var/log/nginx/comitia-mcp.error.log warn;

    # Hard default: nothing else is routed.
    location / {
        return 404;
    }

    # Credential in the path — the form ChatGPT's connector UI can express.
    # A single segment only, so nothing URL-shaped can smuggle extra path
    # structure past the router.
    location ~ ^/mcp/[A-Za-z0-9_.~-]+$ {
        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    location = /mcp {
        # MCP streamable HTTP uses POST. GET would open an SSE stream, which
        # this stateless adapter does not implement, so it is refused outright.
        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}

# Alternate port, for clients that do not need 443 (Responses API, Agents SDK,
# Cursor, curl). Kept because it is verified and useful — not because ChatGPT
# can use it. ChatGPT cannot: its broker never dials this port.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vmi3260467.contaboserver.net;

    ssl_certificate     /etc/letsencrypt/live/vmi3260467.contaboserver.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmi3260467.contaboserver.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/comitia-mcp.access.log comitia_mcp_safe;
    error_log  /var/log/nginx/comitia-mcp.error.log warn;

    location / {
        return 404;
    }

    location ~ ^/mcp/[A-Za-z0-9_.~-]+$ {
        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    location = /mcp {
        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}

# Plain HTTP for this hostname: serve the ACME challenge, redirect everything
# else. HTTPS is never served on 80.
server {
    listen 80;
    listen [::]:80;
    server_name vmi3260467.contaboserver.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
