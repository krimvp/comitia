# Comitia MCP gateway — public HTTPS edge.
#
# Exposes exactly one route to the internet: POST /mcp, terminated with real
# TLS and forwarded to the loopback streamable-HTTP adapter. Comitia itself
# stays bound to 127.0.0.1 and is never publicly reachable.
#
#   /mcp   -> allowed (POST only)
#   everything else -> 404
#
# /ui/, /v1/*, /admin, /debug, /metrics are unreachable from outside; the
# browser inspector stays an SSH-forwarding concern.

# Per-IP request limit. `limit_req_zone` is valid here because this file is
# included from within nginx's http context.
limit_req_zone $binary_remote_addr zone=comitia_mcp:10m rate=5r/s;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vmi3260467.contaboserver.net 45.88.191.59;

    ssl_certificate     /etc/letsencrypt/live/vmi3260467.contaboserver.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmi3260467.contaboserver.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Bound the request body and headers; MCP tool payloads are small but
    # message bodies can be sizeable.
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Never log credentials: access_log_format omits the Authorization header
    # by default, and error log level stays at warn to avoid body echo.
    access_log /var/log/nginx/comitia-mcp.access.log;
    error_log  /var/log/nginx/comitia-mcp.error.log warn;

    # Hard default: nothing else is routed.
    location / {
        return 404;
    }

    location = /mcp {
        # MCP streamable HTTP uses POST. GET would open an SSE stream, which
        # this stateless adapter does not implement, so it is refused outright.
        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        # The gateway's own Origin check does DNS-rebinding defence; pass the
        # client Origin through unchanged rather than inventing one.
        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}

# Plain HTTP on 8443 is never served; redirect anything arriving on 80 for this
# host so the ACME challenge and a mistyped URL both behave.
server {
    listen 80;
    listen [::]:80;
    server_name vmi3260467.contaboserver.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host:8443$request_uri;
    }
}
