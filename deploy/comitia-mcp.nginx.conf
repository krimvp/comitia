# Comitia MCP gateway — public HTTPS edge.
#
# Exposes exactly one route: POST /mcp, terminated with real TLS and forwarded
# to the loopback streamable-HTTP adapter. Comitia itself stays bound to
# 127.0.0.1 and is never publicly reachable; /ui/, /v1/*, /admin, /debug and
# /metrics are unreachable from outside, and the browser inspector stays an
# SSH-forwarding concern.
#
# Two credential transports, same secret and same revocation:
#
#   POST /mcp                  credential in the Authorization header
#   POST /mcp/<credential>     credential in the path
#
# The header is preferred, because a secret in a URL leaks through shell
# history, proxy logs and screenshots. The path form exists because ChatGPT's
# connector UI offers no field for a custom header.
#
# WHY THIS ALSO LISTENS ON 443
#
# ChatGPT's connector broker only dispatches to the standard HTTPS port. A
# server on a non-standard port receives no traffic at all — the connection is
# never dialled, so it is not a TLS, DNS or firewall fault and no amount of
# server-side testing reveals it. :8443 therefore cannot serve ChatGPT, however
# healthy it looks under curl.
#
# WHY THE HOSTNAME AND NOT THE IP
#
# Another site already terminates TLS on 443 for the bare IP address. The two are
# kept apart entirely by server_name and share nothing. This file sorts before
# that site in sites-enabled, so it is also the fallback server for an
# unrecognised Host header. Every server below therefore refuses any other Host
# with a 404 before routing, rather than proxying it to Comitia.
#
# CREDENTIALS AND LOGS
#
# The access logs use a format without the request line. nginx's error log
# cannot be formatted: every entry about a request (limit_req rejections,
# access denials, upstream 502/504) carries `request: "POST /mcp/<credential>"`
# and the upstream URL. The path-credential locations therefore send their
# error log to /dev/null; failures there remain visible as 429/502/504 in the
# access log, and header-credential requests to /mcp keep full error logging.
# Client header/protocol errors are logged at `info`, below the `warn` kept here.
#
# Port 80 never redirects /mcp: a credential sent over plain HTTP is already
# exposed, so it is refused (403) rather than encouraged to retry, and that
# server logs with the same credential-free format.

# Per-IP request limit. `limit_req_zone` is valid here because this file is
# included from within nginx's http context.
limit_req_zone $binary_remote_addr zone=comitia_mcp:10m rate=5r/s;

# Credentials must never reach the access log. The default combined format
# records the request line, which would include a URL-embedded credential;
# this keeps host, port, method and status only. Never add $request, $uri,
# $request_uri, $args or upstream URL variables to it.
log_format comitia_mcp_safe '$host $server_port "$request_method" $status '
                            '$body_bytes_sent $request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name comitia.example.com;

    ssl_certificate     /etc/letsencrypt/live/comitia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comitia.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/comitia-mcp.access.log comitia_mcp_safe;
    error_log  /var/log/nginx/comitia-mcp.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Fallback server: an unrecognised Host is refused, not proxied.
    if ($host != "comitia.example.com") {
        return 404;
    }

    # Hard default: nothing else is routed.
    location / {
        return 404;
    }

    # Credential in the path — the form ChatGPT's connector UI can express.
    # A single segment only, so nothing URL-shaped can smuggle extra path
    # structure past the router.
    location ~ ^/mcp/[A-Za-z0-9_.~-]+$ {
        # Every error-log entry here would contain the credential.
        error_log /dev/null;

        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    location = /mcp {
        # MCP streamable HTTP uses POST. GET would open an SSE stream, which
        # this stateless adapter does not implement, so it is refused outright.
        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}

# Alternate port, for clients that do not need 443 (Responses API, Agents SDK,
# Cursor, curl). Kept because it is verified and useful — not because ChatGPT
# can use it. ChatGPT cannot: its broker never dials this port.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name comitia.example.com;

    ssl_certificate     /etc/letsencrypt/live/comitia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comitia.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/comitia-mcp.access.log comitia_mcp_safe;
    error_log  /var/log/nginx/comitia-mcp.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Fallback server: an unrecognised Host is refused, not proxied.
    if ($host != "comitia.example.com") {
        return 404;
    }

    location / {
        return 404;
    }

    location ~ ^/mcp/[A-Za-z0-9_.~-]+$ {
        # Every error-log entry here would contain the credential.
        error_log /dev/null;

        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    location = /mcp {
        limit_except POST { deny all; }

        limit_req zone=comitia_mcp burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization and MCP-Protocol-Version are forwarded by default.

        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}

# Plain HTTP for this hostname: serve the ACME challenge, refuse /mcp, redirect
# everything else. HTTPS is never served on 80. Keep this block identical to
# comitia-mcp-acme.nginx.conf: both claim port 80 for this hostname, so if both
# are ever enabled nginx warns and uses one, and they must behave the same.
server {
    listen 80;
    listen [::]:80;
    server_name comitia.example.com;

    access_log /var/log/nginx/comitia-mcp.access.log comitia_mcp_safe;
    error_log  /var/log/nginx/comitia-mcp.error.log warn;

    if ($host != "comitia.example.com") {
        return 404;
    }

    # Serve challenges from the webroot, ahead of any redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # A credential sent in cleartext is refused, never redirected.
    location ^~ /mcp {
        return 403;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
