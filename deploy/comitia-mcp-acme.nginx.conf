# Comitia MCP edge — phase 1: ACME challenge only.
#
# This block exists so Let's Encrypt can complete an HTTP-01 challenge for this
# hostname. It must be installed BEFORE the TLS server block, because that block
# references a certificate which does not exist yet and nginx would refuse to
# load. It is also required because the only other port-80 server on this host
# is another site's, which redirects every request to HTTPS - a redirect the ACME
# validator would follow into a self-signed certificate or an IPv6 refusal.
#
# Retire this file once comitia-mcp.nginx.conf is enabled: that file carries
# the same port-80 server. The server block below is kept identical to it
# (apart from the log format name, which must not collide), so a host that
# has both enabled behaves the same whichever block nginx keeps.

# Credential-free access log: never the request line, which may carry a
# credential sent to /mcp/<credential> over plain HTTP.
log_format comitia_mcp_acme_safe '$host $server_port "$request_method" $status '
                                 '$body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name comitia.example.com;

    access_log /var/log/nginx/comitia-mcp.access.log comitia_mcp_acme_safe;
    error_log  /var/log/nginx/comitia-mcp.error.log warn;

    if ($host != "comitia.example.com") {
        return 404;
    }

    # Serve challenges from the webroot, ahead of any redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # A credential sent in cleartext is refused, never redirected.
    location ^~ /mcp {
        return 403;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
